<app-page title="Use Supertask">
  <grid-main [narrow]="true">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      @if (!isLoading) {
        <input-multiselect
          [isLoading]="isLoading"
          [placeholder]="'Hashlists...'"
          [items]="selectHashlists"
          [label]="'Select or search Hashlists'"
          [mergeIdAndName]="true"
          [multiselectEnabled]="false"
          formControlName="hashlistId"
          class="flex-1"
          [isRequired]="true"
        ></input-multiselect>
      } @else {
        <div class="loading-spinner">
          <mat-spinner diameter="32"></mat-spinner>
          <span>Loading Hashlists...</span>
        </div>
      }
        <input-select
          title="Binary type"
          formControlName="crackerBinaryId"
          [items]="selectCrackertype"
          [isRequired]="true"
        ></input-select>
        <input-select
          title="Binary version"
          formControlName="crackerBinaryTypeId"
          [items]="selectCrackerversions"
          [isRequired]="true"
        ></input-select>
        <input-check
          title="Skip pretasks already completed"
          tooltip="Skip any pretask whose attack (identical command, files and cracker version) has already been fully searched against this hashlist. Tasks whose command differs in any way, or that have not finished, are not skipped."
          formControlName="skipCompleted"
        ></input-check>
      <grid-buttons>
        <button-submit name="Cancel" [disabled]="false" type="cancel"></button-submit>
        <button-submit [name]="'Create'" [loading]="isCreatingLoading"></button-submit>
      </grid-buttons>
    </form>
  </grid-main>
</app-page>
