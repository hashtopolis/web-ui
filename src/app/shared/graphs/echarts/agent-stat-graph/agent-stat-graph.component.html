<div #chartContainer [style.display]="hasData ? 'block' : 'none'" class="w-full h-[var(--chart-height-default)]"></div>

<div [style.display]="!hasData ? 'block' : 'none'">
  @if (statType === ASC.GPU_TEMP) {
    <p>Device(s) temperature data unavailable</p>
  } @else if (statType === ASC.GPU_UTIL) {
    <p>GPU utilisation data unavailable</p>
  } @else if (statType === ASC.CPU_UTIL) {
    <p>CPU utilisation data unavailable</p>
  }
</div>
