<app-page title="Create Supertask">
  <grid-main [narrow]="true">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <input-text title="Name" formControlName="supertaskName" [isRequired]="true"></input-text>

      <input-select
        title="Cracker type"
        formControlName="crackerBinaryTypeId"
        [items]="selectCrackerTypes"
        [isRequired]="true"
      ></input-select>

      <input-multiselect
        [isLoading]="isLoading"
        [placeholder]="'Tasks...'"
        [items]="selectPretasks"
        [label]="'Select or search Tasks'"
        [isRequired]="true"
        [mergeIdAndName]="true"
        formControlName="pretasks"
      ></input-multiselect>

      <grid-buttons>
        <button-submit name="Cancel" [disabled]="false" type="cancel"></button-submit>
        <button-submit [name]="'Create'" [disabled]="false"></button-submit>
      </grid-buttons>
    </form>
  </grid-main>
</app-page>
