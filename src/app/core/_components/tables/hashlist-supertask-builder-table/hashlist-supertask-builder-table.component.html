<div class="builder-table-wrapper">
  @if (unsupportedHashtypeMessage) {
    <fixed-alert data-testid="unsupported-hashtype" [message]="unsupportedHashtypeMessage"></fixed-alert>
  }
  <div class="builder-table-scroll">
    <table class="builder-table">
      <thead>
        <tr>
          <th class="id-col">ID</th>
          <th>Name</th>
        </tr>
      </thead>
      <tbody>
        @for (supertask of supertasks; track supertask.id) {
          <tr>
            <td class="id-col">
              <a [routerLink]="['/tasks', supertask.id, 'edit']">{{ supertask.id }}</a>
            </td>
            <td>
              <div class="row-content">
                <a [routerLink]="['/tasks', supertask.id, 'edit']">{{ supertask.supertaskName }}</a>

                <div class="row-actions">
                  <span class="row-type" data-testid="row-type">{{ typeName(supertask) }}</span>

                  @if (isRowBlocked(supertask)) {
                    <span class="row-hint" data-testid="row-blocked">{{ rowBlockedMessage(supertask) }}</span>
                  } @else {
                    <input-select
                      title="Version"
                      [items]="rowVersions[supertask.id] ?? []"
                      [ngModel]="selectedVersionByRow[supertask.id]"
                      (ngModelChange)="selectedVersionByRow[supertask.id] = $event"
                    >
                    </input-select>
                  }

                  <button-submit
                    [name]="'Create Supertask'"
                    [disabled]="!selectedVersionByRow[supertask.id] || (rowLoading[supertask.id] ?? false)"
                    [loading]="rowLoading[supertask.id] ?? false"
                    (click)="createSupertask(supertask.id)"
                  >
                  </button-submit>
                </div>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  @if (dataSource) {
    <mat-paginator
      (page)="onPageChange($event)"
      [disabled]="(dataSource.loading$ | async) ?? false"
      [length]="dataSource.totalItems"
      [pageIndex]="dataSource.index"
      [pageSizeOptions]="pageSizeOptions"
      [pageSize]="dataSource.pageSize"
    ></mat-paginator>
  }
</div>
